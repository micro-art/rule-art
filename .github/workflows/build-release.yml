name: Build rule sets

on:
  push:
    branches:
      - release
    paths:
      - 'src/**'
      - 'scripts/build.mjs'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-rule-sets-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: release
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build rule sets
        run: node scripts/build.mjs

      - name: Commit generated rule sets
        shell: bash
        run: |
          git add --force --all dist

          if git diff --cached --quiet; then
            echo "Generated rule sets are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: build rule sets"
          git push origin HEAD:release
