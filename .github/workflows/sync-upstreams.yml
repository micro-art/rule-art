name: Sync upstream rule sources

on:
  schedule:
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-rule-sources
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      revision: ${{ steps.commit.outputs.revision }}

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Synchronize upstream sources
        run: node scripts/sync-upstreams.mjs --apply

      - name: Verify generated outputs
        run: node scripts/build.mjs

      - name: Commit source updates
        id: commit
        shell: bash
        run: |
          git add reports src state

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync upstream rule sources"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/publish-release.yml
    with:
      source-ref: ${{ needs.sync.outputs.revision }}
